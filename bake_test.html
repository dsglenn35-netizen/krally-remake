<!DOCTYPE html><html><head><meta charset="utf-8"><title>bake</title></head><body>
<div id="out" style="font:16px monospace;color:#0f0;background:#000;padding:8px">running</div>
<script src="js/track.js"></script>
<script src="js/terrain.js"></script>
<script>
try {
  const t0 = performance.now();
  const tr = new Track(TRACKS[0].points, TRACKS[0].width, TRACKS[0].name);
  const t1 = performance.now();
  const map = Terrain.build(tr, 0);
  const t2 = performance.now();
  const msg = 'TRACK ' + Math.round(t1 - t0) + 'ms  BAKE ' + Math.round(t2 - t1) + 'ms  MAP ' + map.w + 'x' + map.h;
  document.getElementById('out').textContent = msg;
  document.title = 'BAKE ' + msg;
} catch (e) {
  document.getElementById('out').textContent = 'ERR ' + e.message;
  document.title = 'BAKE ERR ' + e.message;
}
</script></body></html>
