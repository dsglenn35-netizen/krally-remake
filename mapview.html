<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#05080d}</style></head>
<body><canvas id="cv" width="1800" height="1300"></canvas>
<script src="js/drivers.js"></script><script src="js/art.js"></script><script src="js/track.js"></script><script src="js/terrain.js"></script>
<script>
const ti = parseInt((location.search.match(/t=(\d+)/)||[0,2])[1],10)||0;
const track = new Track(TRACKS[ti].points, TRACKS[ti].width, TRACKS[ti].name);
const map = Terrain.build(track, ti, { scale: 1.6, detail: 2, preview: true });
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const s = Math.min(cv.width / map.w, cv.height / map.h);
g.fillStyle = '#05080d'; g.fillRect(0,0,cv.width,cv.height);
g.drawImage(map.canvas, (cv.width - map.w*s)/2, (cv.height - map.h*s)/2, map.w*s, map.h*s);
document.title='OK';
</script></body></html>
